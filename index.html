<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>0x Store</title>
  <meta name="description" content="Applications open source sans pistage : Bastion, APK Lab, ReplScope, Keyra, TelecomHand, Lumo et Cap. Téléchargement direct depuis les releases GitHub.">
  <meta name="theme-color" content="#F8F2E1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11132A" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    try { const t = localStorage.getItem("store-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#catalogue">Aller au catalogue</a>

  <header class="topbar">
    <div class="wrap topbar__inner">
      <a class="brand" href="#" aria-label="Accueil">
        <span class="brand__mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="brand__name" data-store-name>0x Store</span>
      </a>
      <label class="search">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="search" placeholder="Rechercher une app" autocomplete="off" aria-label="Rechercher une app">
        <kbd>/</kbd>
      </label>
      <a class="btn btn--primary btn--sm install-btn" id="install-store" href="#" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3.5 18a8.5 8.5 0 0 1 17 0z"/><path d="M7 9.5 5.2 6.5M17 9.5l1.8-3"/></svg>
        <span class="install-btn__long">Installer le store</span><span class="install-btn__short">App</span>
      </a>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Changer de thème">
        <svg class="i-sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="wrap hero" id="hero" aria-label="À la une"></section>

    <section class="wrap catalogue" id="catalogue" aria-labelledby="catalogue-title">
      <div class="catalogue__head">
        <div>
          <h2 id="catalogue-title">Toutes les apps</h2>
          <p class="muted" id="result-count"></p>
        </div>
        <div class="chips" role="group" aria-label="Filtrer par plateforme" id="filters">
          <button type="button" class="chip" data-filter="all" aria-pressed="true">Tout</button>
          <button type="button" class="chip" data-filter="android" aria-pressed="false">Android</button>
          <button type="button" class="chip" data-filter="windows" aria-pressed="false">Windows</button>
          <button type="button" class="chip" data-filter="linux" aria-pressed="false">Linux</button>
        </div>
      </div>
      <ul class="grid" id="grid"></ul>
      <p class="empty" id="empty" hidden>Aucune app ne correspond à cette recherche.</p>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer__inner">
      <p>Toutes ces applications sont open source. Chaque bouton de téléchargement pointe directement vers le fichier publié dans la release GitHub officielle.</p>
      <p class="muted" id="generated"></p>
    </div>
  </footer>

  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet__panel">
      <button class="icon-btn sheet__close" type="button" data-close aria-label="Fermer">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div id="sheet-body"></div>
    </div>
  </dialog>

  <dialog class="lightbox" id="lightbox" aria-label="Capture d'écran">
    <button class="icon-btn lightbox__close" type="button" data-close aria-label="Fermer">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <button class="icon-btn lightbox__nav lightbox__nav--prev" type="button" data-step="-1" aria-label="Capture précédente">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>
    </button>
    <img id="lightbox-img" alt="">
    <button class="icon-btn lightbox__nav lightbox__nav--next" type="button" data-step="1" aria-label="Capture suivante">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>
    </button>
    <p class="lightbox__count" id="lightbox-count"></p>
  </dialog>

  <script src="data/apps.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
